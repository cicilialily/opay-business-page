<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>

    <nav class="flex items-center justify-between px-10 py-4 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <img class="w-60 h-auto" src="logo.png" alt="Opay logo" />
      </div>
      <ul class="flex gap-8 list-none text-base text-[#1a2e4a]">
        <li class="text-xl font-bold border-b-2 border-green-500 pb-1">Home</li>
        <li class="text-xl font-semibold">Payments</li>
        <li class="text-xl font-semibold">Solutions</li>
        <li class="text-xl font-semibold">About Us</li>
      </ul>
    </nav>

    <section class="flex items-center justify-between bg-[#f0f0ec] px-16 py-20 min-h-[500px]">
      
      <div class="flex flex-col gap-6 max-w-lg">
        <h1 class="text-6xl font-black text-[#1a1a6e] leading-tight">
          Reliable, Fast & Safe Payments
        </h1>
        <p class="text-gray-600 text-xl font-semibold">
          Get omnichannel payment solutions to grow your business better!
        </p>
        <button class="flex text-bold bg-[#1DCF9F] rounded-[55.2px] h-[55.2px] font-[700px] w-60 text-white text-lg px-8 py-4 rounded-full w-fit jsutify-center">
          Contact Us
        </button>

        <div class="flex items-center gap-4 mt-6 text-sm font-bold text-[#1a2e4a]">
            
          <span class="flex items-center gap-2">Licensed by CBN<span class="text-blue-700"><img src="/icon-cbn.png"></span></span>
          <span class="font-bold decoration-blue-700 text-center">|</span>
          <span class="flex items-center gap-2">Insured by<span class=" text-center text-blue-700"></span><img src="/icon-ndic.png"></span></span>
        </div>
      </div>

      <div class="flex-1 flex justify-end">
        <img class="w-full max-w-xl h-full object-cover" src="opay-banner.png" alt="conatiner filled image" />
      </div>

    </section>

  </body>
</html>
